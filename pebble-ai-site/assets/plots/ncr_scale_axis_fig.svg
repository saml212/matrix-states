<svg viewBox="0 0 840 470" width="100%" style="height:auto;display:block;" role="img" aria-labelledby="fig1title fig1desc" xmlns="http://www.w3.org/2000/svg">
<title id="fig1title">Exact-write capability across binding breadth at two model scales, and the freeze-ordering statistic at both scales</title>
<desc id="fig1desc">Left panel: chance-corrected accuracy at the antipodal top rung, plotted against the pair K, d equals K plus one, for K equals 16, 24, 32 and 40. The frozen-adapter arm sits at ceiling, between 0.988 and 1.000, at both 98M and 392M parameters, the two curves overlapping. The trainable-adapter arm sits at ceiling at 98M but at 392M falls below the capability bar of 0.90 from K equals 32 onward, reaching 0.844 at K equals 40, with all three seeds shown as separate points. Open diamonds show the discharged attribution control, the same trainable cells re-trained on double the tokens: at K equals 32 the point rises to 0.911, back over the capability bar, so that degradation was a token-budget effect; at K equals 40 the constant-learning-rate control reads 0.794, still far below the bar. Right panel: the within-scale ordering statistic, counting how many of 36 frozen-versus-trainable pairs the frozen arm wins. At eleven squarings it reads 30.5 at 98M and 36 of 36 at 392M; at the five-squaring top rung it reads 25 at 98M and 36 of 36 at 392M. A dashed line marks the pre-registered confirmation threshold of 31.5.</desc>
